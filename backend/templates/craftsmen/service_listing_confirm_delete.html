{% extends "base.html" %}

{% block title %}Delete Service Listing{% endblock %}

{% block content %}
<div class="form-shell">
    <section class="surface">
        <h1>Delete Service Listing</h1>
        <p class="muted">You are about to delete "{{ object.title }}". This action cannot be undone.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="button button--danger">Delete</button>
                <a class="button button--ghost" href="{% url 'craftsmen:my_service_listings' %}">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
