{% extends "base.html" %}

{% block title %}Delete Service Listing{% endblock %}

{% block content %}
<div class="mx-auto form-shell">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
            <h1 class="h3 mb-3">Delete Service Listing</h1>
            <p class="text-secondary mb-4">
                You are about to delete "{{ object.title }}". This action cannot be undone.
            </p>
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a class="btn btn-outline-secondary" href="{% url 'craftsmen:service_listing_detail' object.pk %}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
