{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="surface center-panel">
    <span class="label label--muted page-kicker">500 Error</span>
    <h1>Something went wrong on our side.</h1>
    <p class="intro-text">Please try again in a moment. If the issue continues, return to a known page and continue browsing.</p>
    <div class="actions">
        <a class="button button--primary" href="{% url 'home' %}">Back Home</a>
        <a class="button button--ghost" href="{% url 'craftsmen:craftsman_list' %}">Browse Craftsmen</a>
    </div>
</section>
{% endblock %}
