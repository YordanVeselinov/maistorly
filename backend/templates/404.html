{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="surface center-panel">
    <span class="label label--muted page-kicker">404 Error</span>
    <h1>The page you requested could not be found.</h1>
    <p class="intro-text">The link may be outdated or the page may have been moved.</p>
    <div class="actions">
        <a class="button button--primary" href="{% url 'home' %}">Back Home</a>
        <a class="button button--ghost" href="{% url 'jobs:job_list' %}">Browse Jobs</a>
    </div>
</section>
{% endblock %}
